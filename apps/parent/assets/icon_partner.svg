<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="partnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="512" height="512" fill="url(#partnerGrad)" rx="40"/>
  
  <!-- Large "K" letter -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="320" font-weight="bold" text-anchor="middle" fill="white" letter-spacing="-8">K</text>
</svg>