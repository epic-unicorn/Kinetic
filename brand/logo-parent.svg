<!-- Kinetic Link — geometric vector K (square terminals, kinetic gap). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Kinetic Link">
  <title>Kinetic Link</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="120" fill="url(#bg)"/>
  <!-- Stem + arms as thick stroked segments (square caps via stroke-linecap="butt") -->
  <g fill="none" stroke="#FFFFFF" stroke-width="118" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M320 220 V804"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="108" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M400 500 L740 250"/>
    <path d="M400 524 L740 774"/>
  </g>
</svg>
