<!-- Kinetic Link — hi-res of the classic header/launcher K (round caps, no link node). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Kinetic Link">
  <title>Kinetic Link</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- rx ≈ 22% like original 100×100 mark (22/100) -->
  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>
  <!-- Same construction as public/logo-mark.svg K, scaled ×10.24, without link node -->
  <g fill="none" stroke="#FFFFFF" stroke-width="92" stroke-linecap="round" stroke-linejoin="round">
    <path d="M307 246 V778"/>
    <path d="M307 512 L676 246"/>
    <path d="M307 512 L676 778"/>
  </g>
</svg>
