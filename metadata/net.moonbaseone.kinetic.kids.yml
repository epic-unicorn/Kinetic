AutoName:Kinetic Kids
Name:Kinetic Kids

Summary:Kids chores synced from Kinetic Link parents over encrypted WebDAV
Description:|-
    Kinetic Kids shows chores assigned by a parent using Kinetic Link.
    Children mark tasks complete and earn XP. There is no account and no
    telemetry.

    Enrollment uses a family QR from the parent app; the WebDAV password is
    typed on the kids device (it is not embedded in the QR). Assigned tasks
    sync from your own WebDAV server and are encrypted with the family key.

    Requires camera permission only for enrollment QR scanning.

RepoType:git
Repo:https://github.com/ingmarstruijs/Kinetic.git

Builds:
  - versionName: 0.3.0
    versionCode: 1
    commit: REPLACE_WITH_TAG_OR_COMMIT
    subdir: apps/kids
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild: |
      cd ../../
      dart pub global activate melos
      melos bootstrap
    build: |
      flutter build apk --release --build-name=$$VERSION$$ --build-number=$$VERCODE$$

