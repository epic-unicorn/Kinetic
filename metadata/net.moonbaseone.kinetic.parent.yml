AutoName: Kinetic Link
Name: Kinetic Link

Summary: Local-first encrypted family tasks and notes with optional WebDAV sync
Description: |-
    Kinetic Link helps families manage tasks and notes without accounts or
    telemetry. Data stays on your device in an encrypted SQLite database and
    can optionally sync to your own HTTPS WebDAV server (for example Nextcloud)
    using AES-256-GCM encryption.

    Features:
    * Personal tasks and markdown notes
    * Partner proposals via QR pairing
    * Kids chores with XP rewards (use with Kinetic Kids)
    * Offline suggestion heuristics (no cloud AI)
    * Encrypted .kvault backups

    Requires camera permission only for QR pairing/enrollment.
    WebDAV sync requires HTTPS.

RepoType: git
Repo: https://github.com/ingmarstruijs/Kinetic.git

Builds:
  - versionName: 0.3.0
    versionCode: 1
    # Set to the annotated tag (preferred) or commit SHA after merging this prep
    # and tagging v0.3.0 on main. Placeholder updated before fdroiddata MR.
    commit: v0.3.0
    subdir: apps/parent
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.1
    prebuild: |
      cd ../../
      # Match CI / .flutter-version pin
      $$flutter$$ --version
      dart pub global activate melos
      melos bootstrap
    build: |
      $$flutter$$ build apk --release --build-name=$$VERSION$$ --build-number=$$VERCODE$$
    # Reproducibility notes: Flutter and Melos versions are pinned; F-Droid
    # resigns the APK. See metadata/FDROID_SUBMISSION.md.

