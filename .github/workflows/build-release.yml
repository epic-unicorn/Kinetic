name: Build & Sign Flutter Apps

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.3) — defaults to git tag or "dev"'
        required: false

# Least privilege; release job elevates contents for creating GitHub Releases.
permissions:
  contents: read
  actions: write

jobs:
  build-kids-app:
    runs-on: ubuntu-latest
    if: "!endsWith(github.ref_name, '-kids') && !endsWith(github.ref_name, '-parent')"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Dependabot PRs do not receive repository secrets — skip signing there.
      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — using debug signing for this build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          SIZE=$(wc -c < keystore.jks | tr -d ' ')
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore is too small ($SIZE bytes) — secret may be corrupt."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Create key.properties
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Signing secrets incomplete (alias/password missing)."
            exit 1
          fi
          printf '%s\n' \
            'storeFile=../../../keystore.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > apps/kids/android/key.properties

      - name: Get dependencies
        run: |
          flutter pub global activate melos
          "$HOME/.pub-cache/bin/melos" bootstrap

      - name: Build kids app
        run: |
          cd apps/kids
          attempt=1
          max=3
          until flutter build apk --release --build-name=${{ steps.version.outputs.version }}; do
            if [ "$attempt" -ge "$max" ]; then
              echo "APK build failed after $max attempts"
              exit 1
            fi
            echo "Attempt $attempt failed (likely Maven rate limit). Retrying in $((30 * attempt))s..."
            sleep $((30 * attempt))
            attempt=$((attempt + 1))
          done

      - name: Rename kids APK to versioned filename
        run: |
          cp apps/kids/build/app/outputs/flutter-apk/app-release.apk \
             apps/kids/build/app/outputs/flutter-apk/kinetic-kids-${{ steps.version.outputs.version }}.apk

      - name: Upload kids app artifact
        uses: actions/upload-artifact@v7
        with:
          name: kids-app-release
          path: apps/kids/build/app/outputs/flutter-apk/kinetic-kids-${{ steps.version.outputs.version }}.apk

  build-parent-app:
    runs-on: ubuntu-latest
    if: "!endsWith(github.ref_name, '-kids') && !endsWith(github.ref_name, '-parent')"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — using debug signing for this build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          SIZE=$(wc -c < keystore.jks | tr -d ' ')
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore is too small ($SIZE bytes) — secret may be corrupt."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Create key.properties
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Signing secrets incomplete (alias/password missing)."
            exit 1
          fi
          printf '%s\n' \
            'storeFile=../../../keystore.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > apps/parent/android/key.properties

      - name: Get dependencies
        run: |
          flutter pub global activate melos
          "$HOME/.pub-cache/bin/melos" bootstrap

      - name: Build parent app
        run: |
          cd apps/parent
          attempt=1
          max=3
          until flutter build apk --release --build-name=${{ steps.version.outputs.version }}; do
            if [ "$attempt" -ge "$max" ]; then
              echo "APK build failed after $max attempts"
              exit 1
            fi
            echo "Attempt $attempt failed (likely Maven rate limit). Retrying in $((30 * attempt))s..."
            sleep $((30 * attempt))
            attempt=$((attempt + 1))
          done

      - name: Rename parent APK to versioned filename
        run: |
          cp apps/parent/build/app/outputs/flutter-apk/app-release.apk \
             apps/parent/build/app/outputs/flutter-apk/kinetic-parent-${{ steps.version.outputs.version }}.apk

      - name: Upload parent app artifact
        uses: actions/upload-artifact@v7
        with:
          name: parent-app-release
          path: apps/parent/build/app/outputs/flutter-apk/kinetic-parent-${{ steps.version.outputs.version }}.apk

  release:
    needs: [build-kids-app, build-parent-app]
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-kids') && !endsWith(github.ref_name, '-parent')"
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download kids app
        uses: actions/download-artifact@v4
        with:
          name: kids-app-release
          path: ./artifacts/kids

      - name: Download parent app
        uses: actions/download-artifact@v4
        with:
          name: parent-app-release
          path: ./artifacts/parent

      - name: Generate checksums
        run: |
          sha256sum ./artifacts/kids/kinetic-kids-*.apk | awk '{print $1}' > ./artifacts/kids/sha256.txt
          sha256sum ./artifacts/parent/kinetic-parent-*.apk | awk '{print $1}' > ./artifacts/parent/sha256.txt
          echo "KIDS_SHA256=$(cat ./artifacts/kids/sha256.txt)" >> $GITHUB_ENV
          echo "PARENT_SHA256=$(cat ./artifacts/parent/sha256.txt)" >> $GITHUB_ENV

      - name: Extract certificate fingerprints
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore.jks
          CERT_FP=$(keytool -list -v \
            -keystore /tmp/keystore.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            2>/dev/null | grep "SHA256:" | awk '{print $2}')
          rm -f /tmp/keystore.jks
          echo "KIDS_CERT_SHA256=$CERT_FP" >> $GITHUB_ENV
          echo "PARENT_CERT_SHA256=$CERT_FP" >> $GITHUB_ENV

      - name: Create Kids App Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-kids
          name: Kids App ${{ github.ref_name }}
          body: |
            ## SHA-256 Checksum
            Verify the integrity of the downloaded APK:
            ```
            ${{ env.KIDS_SHA256 }}  kinetic-kids-${{ steps.version.outputs.version }}.apk
            ```

            ## Certificate Fingerprint (AppVerifier)
            SHA-256 fingerprint of the signing certificate:
            ```
            ${{ env.KIDS_CERT_SHA256 }}
            ```
          files: |
            ./artifacts/kids/kinetic-kids-${{ steps.version.outputs.version }}.apk
            ./artifacts/kids/sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Parent App Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-parent
          name: Parent App ${{ github.ref_name }}
          body: |
            ## SHA-256 Checksum
            Verify the integrity of the downloaded APK:
            ```
            ${{ env.PARENT_SHA256 }}  kinetic-parent-${{ steps.version.outputs.version }}.apk
            ```

            ## Certificate Fingerprint (AppVerifier)
            SHA-256 fingerprint of the signing certificate:
            ```
            ${{ env.PARENT_CERT_SHA256 }}
            ```
          files: |
            ./artifacts/parent/kinetic-parent-${{ steps.version.outputs.version }}.apk
            ./artifacts/parent/sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
