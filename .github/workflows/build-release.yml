name: Build & Sign Flutter Apps

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-kids-app:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/kids/android/key.properties << EOF
          storeFile=../../../keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Get dependencies
        run: |
          echo "Working dir: $(pwd)"
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
          flutter pub global activate melos
          $HOME/.pub-cache/bin/melos bootstrap

      - name: Build kids app
        run: |
          cd apps/kids
          flutter build apk --release --build-name=${{ steps.version.outputs.version }}

      - name: Upload kids app artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-app-release
          path: apps/kids/build/app/outputs/flutter-apk/app-release.apk

  build-parent-app:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/parent/android/key.properties << EOF
          storeFile=../../../keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Get dependencies
        run: |
          echo "Working dir: $(pwd)"
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
          flutter pub global activate melos
          $HOME/.pub-cache/bin/melos bootstrap

      - name: Build parent app
        run: |
          cd apps/parent
          flutter build apk --release --build-name=${{ steps.version.outputs.version }}

      - name: Upload parent app artifact
        uses: actions/upload-artifact@v4
        with:
          name: parent-app-release
          path: apps/parent/build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: [build-kids-app, build-parent-app]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download kids app
        uses: actions/download-artifact@v4
        with:
          name: kids-app-release
          path: ./artifacts/kids

      - name: Download parent app
        uses: actions/download-artifact@v4
        with:
          name: parent-app-release
          path: ./artifacts/parent

      - name: Generate checksums
        run: |
          sha256sum ./artifacts/kids/app-release.apk | awk '{print $1}' > ./artifacts/kids/sha256.txt
          sha256sum ./artifacts/parent/app-release.apk | awk '{print $1}' > ./artifacts/parent/sha256.txt
          echo "KIDS_SHA256=$(cat ./artifacts/kids/sha256.txt)" >> $GITHUB_ENV
          echo "PARENT_SHA256=$(cat ./artifacts/parent/sha256.txt)" >> $GITHUB_ENV

      - name: Create Kids App Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-kids
          name: Kids App ${{ github.ref_name }}
          body: |
            ## SHA-256 Checksum
            Verify the integrity of the downloaded APK:
            ```
            ${{ env.KIDS_SHA256 }}  kinetic-kids-${{ github.ref_name }}.apk
            ```
          files: |
            ./artifacts/kids/app-release.apk
            ./artifacts/kids/sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Parent App Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-parent
          name: Parent App ${{ github.ref_name }}
          body: |
            ## SHA-256 Checksum
            Verify the integrity of the downloaded APK:
            ```
            ${{ env.PARENT_SHA256 }}  kinetic-parent-${{ github.ref_name }}.apk
            ```
          files: |
            ./artifacts/parent/app-release.apk
            ./artifacts/parent/sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
