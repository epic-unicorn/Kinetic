name: Build & Sign Flutter Apps

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-kids-app:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/kids/android/key.properties << EOF
          storeFile=../../../keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Get dependencies
        run: melos bootstrap

      - name: Build kids app
        run: |
          cd apps/kids
          flutter build apk --release

      - name: Upload kids app artifact
        uses: actions/upload-artifact@v3
        with:
          name: kids-app-release
          path: apps/kids/build/app/outputs/flutter-apk/app-release.apk

  build-parent-app:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > apps/parent/android/key.properties << EOF
          storeFile=../../../keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Get dependencies
        run: melos bootstrap

      - name: Build parent app
        run: |
          cd apps/parent
          flutter build apk --release

      - name: Upload parent app artifact
        uses: actions/upload-artifact@v3
        with:
          name: parent-app-release
          path: apps/parent/build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: [build-kids-app, build-parent-app]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download kids app
        uses: actions/download-artifact@v3
        with:
          name: kids-app-release
          path: ./artifacts/kids

      - name: Download parent app
        uses: actions/download-artifact@v3
        with:
          name: parent-app-release
          path: ./artifacts/parent

      - name: Create Kids App Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-kids
          name: Kids App ${{ github.ref_name }}
          files: ./artifacts/kids/app-release.apk
      
      - name: Create Parent App Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-parent
          name: Parent App ${{ github.ref_name }}
          files: ./artifacts/parent/app-release.apk
