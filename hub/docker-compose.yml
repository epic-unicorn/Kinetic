services:
  # ---------------------------------------------------------------------------
  # CouchDB 3 — the sync hub.  All encrypted family documents are stored here.
  # Devices discover this hub via mDNS and push/pull incrementally.
  # ---------------------------------------------------------------------------
  couchdb:
    image: couchdb:3.4
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-kinetic}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-changeme}
    volumes:
      - couch_data:/opt/couchdb/data
    ports:
      - "5984:5984"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5984/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # One-shot init container: finishes CouchDB single-node setup and creates
  # the kinetic_family database.  Runs once and exits.
  # ---------------------------------------------------------------------------
  couch_init:
    image: curlimages/curl:latest
    depends_on:
      couchdb:
        condition: service_healthy
    volumes:
      - ./init:/init:ro
    entrypoint: ["/bin/sh", "/init/setup-couch.sh"]
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-kinetic}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-changeme}
      COUCHDB_HOST: couchdb
      COUCHDB_PORT: 5984
    restart: on-failure

  # ---------------------------------------------------------------------------
  # mDNS advertiser — announces the hub on the local network so that the
  # Flutter apps discover it automatically via BonsoirMdnsDiscoveryService.
  #
  # NOTE: requires network_mode: host, which works on Linux (e.g. Raspberry Pi).
  # On macOS / Windows Docker Desktop, run advertise/advertise.py directly on
  # the host instead:
  #   pip install zeroconf && python hub/advertise/advertise.py
  # ---------------------------------------------------------------------------
  advertiser:
    build:
      context: ./advertise
    network_mode: host
    environment:
      COUCH_PORT: ${COUCH_PORT:-5984}
      HUB_ID: ${HUB_ID:-kinetic-hub}
    depends_on:
      couch_init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Enrollment server — serves a QR code at http://<hub-ip>:8765/enroll
  # that the parent app scans on first launch to receive the mesh key +
  # CouchDB credentials.  Bind-mount nothing sensitive; credentials come
  # from the .env file.  You can stop this container after family setup.
  # ---------------------------------------------------------------------------
  enroll:
    build:
      context: ./enroll
    ports:
      - "8765:8765"
    environment:
      MESH_KEY_HEX: ${MESH_KEY_HEX}
      COUCHDB_USER: ${COUCHDB_USER:-kinetic}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-changeme}
      HUB_ID: ${HUB_ID:-kinetic-hub}
      ENROLL_PORT: 8765
    depends_on:
      couch_init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  couch_data:
